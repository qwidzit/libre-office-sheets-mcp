name: tests

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# A new push supersedes an in-flight run; without this a hung job keeps a
# runner busy until GitHub's own six-hour limit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (LibreOffice bundled Python)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install LibreOffice
        run: choco install libreoffice-fresh -y --no-progress
        shell: pwsh

      # The whole zero-install design rests on LibreOffice shipping a Python
      # that can import uno. Prove that before anything else.
      - name: Find LibreOffice's Python and import uno
        id: lo
        shell: pwsh
        run: |
          $roots = @($env:ProgramFiles, ${env:ProgramFiles(x86)}, $env:ProgramW6432) |
                   Where-Object { $_ } | ForEach-Object { Join-Path $_ 'LibreOffice' }
          $python = $null
          foreach ($root in $roots) {
            $candidate = Join-Path $root 'program\python.exe'
            if (Test-Path $candidate) { $python = $candidate; break }
          }
          if (-not $python) {
            Write-Host "Searching for python.exe under the LibreOffice install..."
            foreach ($root in $roots) {
              if (Test-Path $root) {
                $hit = Get-ChildItem $root -Recurse -Filter python.exe -ErrorAction SilentlyContinue |
                       Select-Object -First 1
                if ($hit) { $python = $hit.FullName; break }
              }
            }
          }
          if (-not $python) { throw "LibreOffice did not ship a python.exe - the zero-install premise fails on this install." }
          Write-Host "python.exe: $python"
          & $python -c "import uno, sys; print('uno imports OK under', sys.version)"
          if ($LASTEXITCODE -ne 0) { throw "python.exe cannot import uno" }
          "python=$python" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # The file a person actually double-clicks. It has to find LibreOffice on
      # its own, so run it before anything hands it a path.
      - name: Check setup.bat (what a user double-clicks)
        shell: cmd
        env:
          LOCALC_NO_PAUSE: "1"
        run: call "Check setup.bat"

      # Prints interpreter facts and the soffice candidate list, then exercises
      # discovery, the detached launch and the UNO connection. First, so its
      # diagnostics are on record even when a later step fails.
      - name: Setup check (diagnostics + auto-launch + connect)
        shell: pwsh
        run: |
          & "${{ steps.lo.outputs.python }}" -u scripts\check-setup.py

      # Needs no LibreOffice process, so a failure here is purely the protocol.
      - name: MCP protocol suite
        shell: pwsh
        run: |
          & "${{ steps.lo.outputs.python }}" -u scripts\smoke_protocol.py

      - name: End-to-end suites
        shell: pwsh
        timeout-minutes: 20
        run: |
          foreach ($suite in @('smoke_calc', 'smoke_extras', 'smoke_filter', 'smoke_course', 'smoke_advanced')) {
            Write-Host "::group::$suite"
            & "${{ steps.lo.outputs.python }}" -u "scripts\$suite.py"
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            # Stop here rather than carrying on: the failing suite's output is
            # then the last thing in the log, where it can actually be read.
            if ($code -ne 0) { throw "suite failed: $suite" }
          }

  linux:
    name: Linux (system Python + uno)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install LibreOffice Calc and the UNO bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc python3-uno xvfb

      - name: MCP protocol suite
        run: python3 -u scripts/smoke_protocol.py

      - name: End-to-end suites
        timeout-minutes: 12
        run: |
          Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          sleep 3
          export DISPLAY=:99
          python3 -u scripts/check-setup.py
          for suite in smoke_calc smoke_extras smoke_filter smoke_course smoke_advanced; do
            echo "::group::$suite"
            python3 -u "scripts/$suite.py" || { echo "suite failed: $suite"; exit 1; }
            echo "::endgroup::"
          done
